name: API tests (Newman)

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      ecom_ref:
        description: 'Branch, tag or SHA of the application repository to test'
        required: false
        default: ''

concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The application branch under test. The tests assert the fixed behaviour, so this must be a branch that contains the application's fixes. Change it to the default branch once the fixes are merged there.
  ECOM_REF: qa-test-automation

jobs:
  newman:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out the collections
        uses: actions/checkout@v4

      - name: Check out the application under test
        uses: actions/checkout@v4
        with:
          repository: mirzamaazbaig/ecommerce-test-automation
          ref: ${{ inputs.ecom_ref || env.ECOM_REF }}
          path: app

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/server/package-lock.json

      - name: Install the application's server
        run: npm ci --prefix app/server

      - name: Create and seed the database
        working-directory: app/server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecom_db
        run: |
          node db/setup.js
          node scripts/migrate.js
          node scripts/seedProducts.js

      - name: Start the API
        working-directory: app/server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecom_db
          SESSION_SECRET: ci-only-secret
          NODE_ENV: test
        run: |
          nohup node index.js > ../../api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/ > /dev/null && exit 0
            sleep 1
          done
          echo "API did not start"; cat ../../api.log; exit 1

      - name: Install Newman
        run: npm ci

      - name: Run the API collections
        run: npm run test:all

      - name: Upload HTML reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: newman-reports
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload API log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-log
          path: api.log
          if-no-files-found: ignore
          retention-days: 14
